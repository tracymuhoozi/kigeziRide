services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: kigeziride
      POSTGRES_USER: kigeziride
      POSTGRES_PASSWORD: kigeziride
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kigeziride -d kigeziride"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgis://kigeziride:kigeziride@db:5432/kigeziride
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  pgdata: